# Rebuild the bubble overlay hourly from the private source repo and publish it to GitHub Pages.
#
# The source repo is read with a read-only deploy key (secret PRIVATE_REPO_DEPLOY_KEY). This repo is
# public, and so are its Actions logs: the build's full output is never printed (it lists positions),
# only its one-line summary. The page itself is built with --public (no position sizes, dollar P&L or
# tranche budgets) and must pass the privacy checks below before it is deployed.
name: publish overlay

on:
  schedule:
    - cron: "7 * * * *"        # hourly, around the clock (UTC); GitHub may delay scheduled runs
  workflow_dispatch: {}

permissions:
  contents: write              # commit index.html for history
  pages: write
  id-token: write

concurrency:
  group: publish-overlay
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out this site
        uses: actions/checkout@v4

      - name: Check out the private source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: kutlayhanli/equity-anaylsis-tool
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          path: src
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build the public overlay (summary line only)
        working-directory: src
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          set +e
          uv run python research/bubble/overlay.py "$RUNNER_TEMP/out/index.html" --public > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          set -e
          grep -E '^wrote ' "$RUNNER_TEMP/build.log" | sed "s#$RUNNER_TEMP/out/##" || true
          n=$(grep -oE ': [0-9]+ series' "$RUNNER_TEMP/build.log" | grep -oE '[0-9]+' || echo 0)
          if [ ! -s "$RUNNER_TEMP/out/index.html" ] || [ "${n:-0}" -lt 60 ]; then
            echo "::error::build failed (exit $code, $n series); log withheld because this repo's logs are public"
            exit 1
          fi

      - name: Privacy checks
        run: |
          python3 - "$RUNNER_TEMP/out/index.html" <<'PY'
          import os, re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          checks = {
              "larger than 100 KB": os.path.getsize(p) > 100 * 1024,
              "noindex meta present": 'name="robots" content="noindex' in s,
              "no dollar P&L": "P&amp;L $" not in s,
              "no tranche budgets": "Max cost" not in s,
              "no share count in trigger text": not re.search(r"open position: [0-9]", s),
              "no share count in position list": not re.search(r"<li><b>[0-9][0-9,]* [A-Z]", s),
          }
          for k, v in checks.items():
              print(("ok   " if v else "FAIL ") + k)
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Commit the page for history
        run: |
          cp "$RUNNER_TEMP/out/index.html" index.html
          git config user.name "bubble-overlay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no change"; else
            git commit -q -m "overlay: hourly refresh $(date -u '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main
          fi

      - name: Prepare the Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html "$RUNNER_TEMP/site/index.html"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
